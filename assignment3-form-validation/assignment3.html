<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: #212529;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1.5px solid #ced4da;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            color: #333;
        }

        .form-group input::placeholder {
            color: #999999;
        }

        /* Green border for valid field */
        .form-group input.valid {
            border-color: #28a745;
        }

        /* Red border for invalid field */
        .form-group input.invalid {
            border-color: #dc3545;
        }

        .error-text {
            display: none;
            color: #dc3545;
            font-size: 11.5px;
            margin-top: 5px;
            line-height: 1.3;
        }

        .form-group.has-error .error-text {
            display: block;
        }

        .btn-submit {
            width: 100%;
            background-color: #007bff;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>User Registration</h2>
        <form id="registrationForm" novalidate>

            <div class="form-group" id="fullNameGroup">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name">
                <div class="error-text" id="fullNameError">Please enter a valid full name.</div>
            </div>

            <div class="form-group" id="emailGroup">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="example@domain.com">
                <div class="error-text" id="emailError">Enter a valid email address (e.g., user@domain.com).</div>
            </div>

            <div class="form-group" id="phoneGroup">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="10-digit phone number">
                <div class="error-text" id="phoneError">Must be a valid 10-digit numeric value.</div>
            </div>

            <div class="form-group" id="passwordGroup">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
                <div class="error-text" id="passwordError">Min 8 chars, with at least 1 uppercase, 1 lowercase, and 1 number.
                </div>
            </div>

            <button type="submit" class="btn-submit">Register</button>

        </form>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const phoneInput = document.getElementById('phone');
        const passwordInput = document.getElementById('password');

        const fullNameGroup = document.getElementById('fullNameGroup');
        const emailGroup = document.getElementById('emailGroup');
        const phoneGroup = document.getElementById('phoneGroup');
        const passwordGroup = document.getElementById('passwordGroup');

        const nameRegex = /^[a-zA-Z]{3,}$/;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const phoneRegex = /^\d{10}$/;
        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

        function validateField(input, group, regex) {
            const value = input.value.trim();
            if (regex.test(value)) {
                input.classList.remove('invalid');
                input.classList.add('valid');
                group.classList.remove('has-error');
                return true;
            } else {
                input.classList.remove('valid');
                input.classList.add('invalid');
                group.classList.add('has-error');
                return false;
            }
        }

        fullNameInput.addEventListener('input', () => {
            if (fullNameInput.value.trim() !== '') {
                validateField(fullNameInput, fullNameGroup, nameRegex);
            } else {
                fullNameInput.classList.remove('valid', 'invalid');
                fullNameGroup.classList.remove('has-error');
            }
        });

        emailInput.addEventListener('input', () => {
            if (emailInput.value.trim() !== '') {
                validateField(emailInput, emailGroup, emailRegex);
            } else {
                emailInput.classList.remove('valid', 'invalid');
                emailGroup.classList.remove('has-error');
            }
        });

        phoneInput.addEventListener('input', () => {
            if (phoneInput.value.trim() !== '') {
                validateField(phoneInput, phoneGroup, phoneRegex);
            } else {
                phoneInput.classList.remove('valid', 'invalid');
                phoneGroup.classList.remove('has-error');
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value.trim() !== '') {
                validateField(passwordInput, passwordGroup, passwordRegex);
            } else {
                passwordInput.classList.remove('valid', 'invalid');
                passwordGroup.classList.remove('has-error');
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const isNameValid = validateField(fullNameInput, fullNameGroup, nameRegex);
            const isEmailValid = validateField(emailInput, emailGroup, emailRegex);
            const isPhoneValid = validateField(phoneInput, phoneGroup, phoneRegex);
            const isPasswordValid = validateField(passwordInput, passwordGroup, passwordRegex);

            if (isNameValid && isEmailValid && isPhoneValid && isPasswordValid) {
                alert('Registration successful!');
            }
        });
    </script>

</body>

</html>
