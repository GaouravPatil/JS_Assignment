<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 7 - Express REST API</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #0f172a;
        background: linear-gradient(160deg, #eef6ff 0%, #f8fafc 45%, #e0f2fe 100%);
        padding: 48px 16px;
      }

      .page {
        width: min(920px, 100%);
        margin: 0 auto;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: clamp(24px, 4vw, 34px);
        color: #0c4a6e;
      }

      .subtitle {
        margin: 0;
        color: #475569;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: #dcfce7;
        color: #166534;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid #bbf7d0;
      }

      .badge::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #16a34a;
      }

      .grid {
        display: grid;
        grid-template-columns: minmax(260px, 340px) 1fr;
        gap: 20px;
        align-items: start;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }

      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
        padding: 22px;
      }

      .card h2 {
        margin: 0 0 4px;
        font-size: 18px;
        color: #0f172a;
      }

      .card .hint {
        margin: 0 0 18px;
        color: #64748b;
        font-size: 13px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
        color: #334155;
      }

      input {
        width: 100%;
        padding: 11px 13px;
        margin-bottom: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 9px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      input:focus {
        border-color: #0ea5e9;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.16);
      }

      .actions {
        display: flex;
        gap: 10px;
      }

      button {
        font: inherit;
        border: none;
        border-radius: 9px;
        cursor: pointer;
        transition: background-color 0.15s, opacity 0.15s;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .primary {
        flex: 1;
        padding: 11px 16px;
        font-weight: 600;
        color: #ffffff;
        background: #0284c7;
      }

      .primary:hover:not(:disabled) {
        background: #0369a1;
      }

      .ghost {
        padding: 11px 16px;
        font-weight: 600;
        color: #0369a1;
        background: #e0f2fe;
      }

      .ghost:hover:not(:disabled) {
        background: #bae6fd;
      }

      .message {
        display: none;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 9px;
        font-size: 13px;
        line-height: 1.4;
      }

      .message.show {
        display: block;
      }

      .message.success {
        color: #166534;
        background: #f0fdf4;
        border: 1px solid #bbf7d0;
      }

      .message.error {
        color: #991b1b;
        background: #fef2f2;
        border: 1px solid #fecaca;
      }

      .user-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 460px;
        overflow-y: auto;
      }

      .user-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid #e2e8f0;
        border-radius: 11px;
        background: #f8fafc;
      }

      .avatar {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: 0 0 40px;
        border-radius: 50%;
        background: #bae6fd;
        color: #075985;
        font-weight: 700;
      }

      .user-info {
        min-width: 0;
        flex: 1;
      }

      .user-info strong {
        display: block;
        font-size: 14px;
      }

      .user-info span {
        display: block;
        margin-top: 2px;
        color: #64748b;
        font-size: 13px;
        overflow-wrap: anywhere;
      }

      .user-id {
        flex: 0 0 auto;
        padding: 4px 9px;
        border-radius: 999px;
        background: #e2e8f0;
        color: #475569;
        font-size: 12px;
        font-weight: 600;
      }

      .row-actions {
        display: flex;
        gap: 6px;
      }

      .row-actions button {
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 600;
      }

      .edit {
        color: #0369a1;
        background: #e0f2fe;
      }

      .edit:hover {
        background: #bae6fd;
      }

      .delete {
        color: #b91c1c;
        background: #fee2e2;
      }

      .delete:hover {
        background: #fecaca;
      }

      .empty {
        padding: 32px 16px;
        text-align: center;
        color: #64748b;
        border: 1px dashed #cbd5e1;
        border-radius: 11px;
        font-size: 14px;
      }

      footer {
        margin-top: 22px;
        color: #64748b;
        font-size: 12px;
        text-align: center;
      }

      code {
        padding: 2px 6px;
        border-radius: 5px;
        background: #e2e8f0;
        color: #0f172a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div>
          <h1>Assignment 7 - Express REST API</h1>
          <p class="subtitle">In-memory User CRUD API running on port 5000.</p>
        </div>
        <div class="badge" id="status">API connected</div>
      </header>

      <div class="grid">
        <section class="card">
          <h2 id="form-title">Add a user</h2>
          <p class="hint">Sends a POST request to <code>/api/users</code>.</p>

          <form id="user-form">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="e.g. Aarav Sharma" required />

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="e.g. aarav@example.com" required />

            <div class="actions">
              <button class="primary" type="submit" id="submit-btn">Create user</button>
              <button class="ghost" type="button" id="cancel-btn" hidden>Cancel</button>
            </div>
          </form>

          <div class="message" id="message" role="status"></div>
        </section>

        <section class="card">
          <h2>Users</h2>
          <p class="hint">Fetched from <code>GET /api/users</code>.</p>
          <div class="user-list" id="user-list"></div>
        </section>
      </div>

      <footer>
        Endpoints: GET /api/users &middot; GET /api/users/:id &middot; POST /api/users &middot; PUT /api/users/:id &middot; DELETE /api/users/:id
      </footer>
    </div>

    <script>
      const userForm = document.getElementById("user-form");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const submitBtn = document.getElementById("submit-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const formTitle = document.getElementById("form-title");
      const messageBox = document.getElementById("message");
      const userList = document.getElementById("user-list");
      const statusBadge = document.getElementById("status");

      let editingId = null;

      function showMessage(text, type) {
        messageBox.textContent = text;
        messageBox.className = `message show ${type}`;
      }

      function clearMessage() {
        messageBox.textContent = "";
        messageBox.className = "message";
      }

      function resetForm() {
        editingId = null;
        userForm.reset();
        formTitle.textContent = "Add a user";
        submitBtn.textContent = "Create user";
        cancelBtn.hidden = true;
      }

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"']/g,
          (character) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;"
            })[character]
        );
      }

      async function request(url, options) {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || `Request failed with status ${response.status}`);
        }

        return data;
      }

      function renderUsers(users) {
        if (!users.length) {
          userList.innerHTML = '<div class="empty">No users yet. Create one using the form.</div>';
          return;
        }

        userList.innerHTML = users
          .map(
            (user) => `
              <div class="user-row">
                <div class="avatar">${escapeHtml(user.name.charAt(0).toUpperCase())}</div>
                <div class="user-info">
                  <strong>${escapeHtml(user.name)}</strong>
                  <span>${escapeHtml(user.email)}</span>
                </div>
                <span class="user-id">#${user.id}</span>
                <div class="row-actions">
                  <button class="edit" data-action="edit" data-id="${user.id}">Edit</button>
                  <button class="delete" data-action="delete" data-id="${user.id}">Delete</button>
                </div>
              </div>
            `
          )
          .join("");
      }

      async function loadUsers() {
        try {
          const users = await request("/api/users");
          statusBadge.textContent = "API connected";
          renderUsers(users);
        } catch (error) {
          statusBadge.textContent = "API unavailable";
          userList.innerHTML = `<div class="empty">${escapeHtml(error.message)}</div>`;
        }
      }

      userForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessage();

        const payload = {
          name: nameInput.value.trim(),
          email: emailInput.value.trim()
        };

        if (!payload.name || !payload.email) {
          showMessage("Name and email are required.", "error");
          return;
        }

        const isEditing = editingId !== null;
        submitBtn.disabled = true;

        try {
          const data = await request(isEditing ? `/api/users/${editingId}` : "/api/users", {
            method: isEditing ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          showMessage(data.message, "success");
          resetForm();
          await loadUsers();
        } catch (error) {
          showMessage(error.message, "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      userList.addEventListener("click", async (event) => {
        const button = event.target.closest("button[data-action]");

        if (!button) {
          return;
        }

        const id = Number(button.dataset.id);

        if (button.dataset.action === "edit") {
          const users = await request("/api/users");
          const user = users.find((item) => item.id === id);

          if (!user) {
            showMessage("User not found.", "error");
            return;
          }

          editingId = id;
          nameInput.value = user.name;
          emailInput.value = user.email;
          formTitle.textContent = `Edit user #${id}`;
          submitBtn.textContent = "Save changes";
          cancelBtn.hidden = false;
          nameInput.focus();
          return;
        }

        if (!window.confirm("Delete this user?")) {
          return;
        }

        try {
          const data = await request(`/api/users/${id}`, { method: "DELETE" });
          showMessage(data.message, "success");

          if (editingId === id) {
            resetForm();
          }

          await loadUsers();
        } catch (error) {
          showMessage(error.message, "error");
        }
      });

      cancelBtn.addEventListener("click", () => {
        resetForm();
        clearMessage();
      });

      loadUsers();
    </script>
  </body>
</html>
